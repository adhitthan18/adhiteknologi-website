# Nginx untuk adhiteknologi.com
#
# Pasang di server:
#   sudo cp nginx.conf /etc/nginx/sites-available/adhiteknologi.com
#   sudo ln -s /etc/nginx/sites-available/adhiteknologi.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat TLS — pilih salah satu:
#
# A. Domain diproksikan Cloudflare (awan oranye) — paling praktis:
#    Buat Origin Certificate di dashboard Cloudflare (SSL/TLS > Origin Server),
#    simpan sebagai /etc/ssl/cloudflare/adhiteknologi.pem dan .key, lalu pakai
#    baris ssl_certificate versi Cloudflare di bawah. Set mode SSL/TLS ke
#    "Full (strict)". Certbot TIDAK dipakai di skenario ini.
#
# B. Domain langsung ke server (awan abu-abu):
#    sudo certbot --nginx -d adhiteknologi.com -d www.adhiteknologi.com
#    Certbot akan mengisi sendiri baris ssl_certificate di bawah.

upstream adhiteknologi_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name adhiteknologi.com www.adhiteknologi.com;

    # Biarkan certbot memperbarui sertifikat lewat jalur ini.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://adhiteknologi.com$request_uri;
    }
}

# www -> non-www (satu URL kanonik saja, sesuai canonical di <head>)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.adhiteknologi.com;

    ssl_certificate     /etc/letsencrypt/live/adhiteknologi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhiteknologi.com/privkey.pem;

    return 301 https://adhiteknologi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adhiteknologi.com;

    # Opsi B (Let's Encrypt):
    ssl_certificate     /etc/letsencrypt/live/adhiteknologi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhiteknologi.com/privkey.pem;
    # Opsi A (Cloudflare Origin Certificate) — pakai dua baris ini sebagai gantinya:
    # ssl_certificate     /etc/ssl/cloudflare/adhiteknologi.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/adhiteknologi.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Header keamanan ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Kompresi ---
    # `compress: false` di next.config.ts sengaja mematikan gzip Next.js supaya
    # tidak dikerjakan dua kali; Nginx yang menanganinya di sini.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    client_max_body_size 4m;

    # --- Aset ber-hash: aman di-cache selamanya ---
    # Font next/font juga berada di /_next/static/media/, jadi ikut tercakup di sini.
    location /_next/static/ {
        proxy_pass http://adhiteknologi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Semua permintaan lain ---
    location / {
        proxy_pass http://adhiteknologi_app;
        proxy_http_version 1.1;

        # Di belakang Cloudflare, $remote_addr adalah IP Cloudflare. IP pengunjung
        # yang sebenarnya ada di CF-Connecting-IP; teruskan bila situs memerlukannya.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering    on;
    }
}
