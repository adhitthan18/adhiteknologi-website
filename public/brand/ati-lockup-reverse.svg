<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="Lockup ATI — reverse">
  <title>Lockup ATI — reverse</title>
  <!-- Blok nama dijustifikasi: tepi kiri x=212, lebar 333px lewat textLength,
       jadi keempat baris rata di kanan maupun kiri. -->
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe375"/><stop offset="100%" stop-color="#f5b301"/></linearGradient>
  </defs>
  <rect width="560" height="190" rx="16" fill="#0a1f44"/>
  <g transform="translate(0, 18)">
    <path d="M70 14 L44 118 L14 118 L56 14 Z" fill="#ffffff"/>
    <path d="M84 14 L126 118 L94 118 L64 40 Z" fill="#8fb6ec"/>
    <path d="M34 82 L118 66 L114 90 L30 106 Z" fill="url(#gd)"/>
  </g>
  <rect x="176" y="30" width="4" height="130" fill="#ffd500" fill-opacity="0.5"/>
  <text x="212" y="66"  font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" textLength="333" lengthAdjust="spacing" fill="#ffffff">PT ADHI</text>
  <text x="212" y="122" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" textLength="333" lengthAdjust="spacing" fill="#ffffff">TEKNOLOGI</text>
  <text x="212" y="156" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" textLength="333" lengthAdjust="spacing" fill="#ffffff">INDONESIA</text>
  <text x="212" y="180" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" textLength="333" lengthAdjust="spacing" fill="#ffd500">TEKNOLOGI • INOVASI • INTEGRASI • SOLUSI</text>
</svg>
